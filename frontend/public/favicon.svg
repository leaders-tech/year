<!--
This file provides the browser favicon for TLF Year.
Edit this file when the favicon design changes.
Do not copy this file; replace it when the whole app icon changes.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <!-- Calendar body -->
  <rect
    x="6"
    y="9"
    width="43"
    height="46"
    rx="7"
    fill="#111827"
  />

  <!-- Calendar header -->
  <path
    d="
      M13 9
      H42
      A7 7 0 0 1 49 16
      V23
      H6
      V16
      A7 7 0 0 1 13 9
      Z
    "
    fill="#287BC1"
  />

  <!-- Binding rings -->
  <rect
    x="15"
    y="5"
    width="5"
    height="12"
    rx="2.5"
    fill="#111827"
  />

  <rect
    x="35"
    y="5"
    width="5"
    height="12"
    rx="2.5"
    fill="#111827"
  />

  <!-- Calendar page -->
  <rect
    x="11"
    y="27"
    width="33"
    height="22"
    rx="3"
    fill="#F8FAFC"
  />

  <!-- A few calendar cells -->
  <rect x="16" y="32" width="6" height="5" rx="1.5" fill="#CBD5E1"/>
  <rect x="25" y="32" width="6" height="5" rx="1.5" fill="#CBD5E1"/>
  <rect x="34" y="32" width="6" height="5" rx="1.5" fill="#CBD5E1"/>

  <rect x="16" y="40" width="6" height="5" rx="1.5" fill="#CBD5E1"/>
  <rect x="25" y="40" width="6" height="5" rx="1.5" fill="#287BC1"/>

  <!-- Share badge -->
  <circle
    cx="48"
    cy="44"
    r="13"
    fill="#287BC1"
    stroke="#F8FAFC"
    stroke-width="3"
  />

  <!-- Share connections -->
  <path
    d="M43.5 43 L51.5 38.5 M43.5 45 L51.5 49.5"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
  />

  <!-- Share nodes -->
  <circle cx="41" cy="44" r="3" fill="#FFFFFF"/>
  <circle cx="54" cy="37" r="3" fill="#FFFFFF"/>
  <circle cx="54" cy="51" r="3" fill="#FFFFFF"/>
</svg>
